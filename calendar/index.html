<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行事曆排程</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee7;
      --blue: #2266a5;
      --green: #027a48;
      --orange: #b54708;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
      font-size: 15px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 8;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
    }
    .top {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, input, select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    button { min-height: 34px; padding: 0 10px; cursor: pointer; color: var(--ink); }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.good { background: var(--green); border-color: var(--green); color: #fff; }
    button.warn { background: var(--orange); border-color: var(--orange); color: #fff; }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 18px 34px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, minmax(130px, 180px));
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select { width: 100%; min-height: 36px; padding: 0 10px; }
    textarea { width: 100%; min-height: 84px; padding: 10px; resize: vertical; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 14px;
    }
    .calendar-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #eef3f8;
      border-bottom: 1px solid var(--line);
    }
    .calendar-title {
      font-weight: 700;
      font-size: 18px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-top: 0;
    }
    .weekday {
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fafbfc;
    }
    .weekday:nth-child(7n) { border-right: 0; }
    .day {
      min-height: 112px;
      padding: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      overflow: hidden;
    }
    .day:nth-child(7n) { border-right: 0; }
    .day.outside { background: #f8fafc; color: #98a2b3; }
    .day.today { box-shadow: inset 0 0 0 2px #80b7e7; }
    .day.selected { background: #eef6ff; }
    .day.overdue { box-shadow: inset 4px 0 0 var(--red); }
    .day-num {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .day-count {
      color: var(--blue);
      font-size: 12px;
      white-space: nowrap;
    }
    .day-event {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      padding: 3px 5px;
      border-radius: 4px;
      background: #f0f7ff;
      color: #184e77;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .day-event.done {
      background: #f3faf6;
      color: #027a48;
    }
    .day-more {
      color: var(--muted);
      font-size: 12px;
    }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #eef3f8;
      border-bottom: 1px solid var(--line);
    }
    .section-title { font-weight: 700; }
    .list { display: grid; gap: 0; }
    .event {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .event:last-child { border-bottom: 0; }
    .event.done { background: #f3faf6; color: #667085; }
    .event.cancel { background: #f6f7f9; color: #667085; }
    .event.overdue { box-shadow: inset 4px 0 0 var(--red); }
    .event-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .event-title { font-weight: 700; line-height: 1.45; }
    .event-date { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .event-meta { color: var(--muted); font-size: 13px; line-height: 1.55; margin-top: 6px; }
    .event-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      margin-right: 5px;
      background: #fff;
      color: var(--muted);
      white-space: nowrap;
    }
    .pill.todo { color: var(--blue); border-color: #a6c8e7; }
    .pill.done { color: var(--green); border-color: #a6e7c7; }
    .pill.cancel { color: #475467; border-color: #cfd4dc; }
    .pill.type { color: var(--orange); border-color: #fed7aa; }
    .empty { padding: 26px; text-align: center; color: var(--muted); }
    dialog {
      width: min(720px, calc(100vw - 24px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
    }
    dialog::backdrop { background: rgba(15,23,42,.35); }
    .modal-body { padding: 18px; }
    .modal-title { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 5px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
    .sync-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 8px; }
    #ghToken {
      min-height: 76px;
      font-family: Consolas, "Segoe UI", monospace;
      -webkit-text-security: disc;
      text-security: disc;
    }
    @media (max-width: 900px) {
      .top { align-items: flex-start; flex-direction: column; }
      .toolbar { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .calendar-grid { grid-template-columns: 1fr; }
      .weekday { display: none; }
      .day {
        min-height: auto;
        border-right: 0;
      }
      .form-grid { grid-template-columns: 1fr; }
      main, header { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <h1>行事曆排程</h1>
        <div class="meta" id="meta">輕量版：月曆看整月衝突，文字清單只看今日與未來 7 天。</div>
      </div>
      <div class="actions">
        <a href="../"><button>入口首頁</button></a>
        <a href="../progress/"><button>進度追蹤</button></a>
        <button onclick="openEvent()">新增事件</button>
        <button onclick="syncProgressTasks()">同步進度任務</button>
        <button onclick="openGithubSync()">GitHub同步</button>
        <button onclick="exportCsv()">匯出CSV</button>
      </div>
    </div>
  </header>
  <main>
    <section class="toolbar">
      <input id="q" placeholder="搜尋：案場、標題、對象、備註" oninput="render()">
      <select id="project" onchange="render()"></select>
      <select id="type" onchange="render()"></select>
      <select id="category" onchange="render()"></select>
      <select id="status" onchange="render()"></select>
      <select id="view" onchange="render()">
        <option value="week">今日與未來7天</option>
        <option value="today">只看今天</option>
        <option value="overdue">逾期未完成</option>
        <option value="all">全部</option>
        <option value="done">完成/取消</option>
      </select>
    </section>
    <section class="calendar-panel">
      <div class="calendar-head">
        <div class="actions">
          <button onclick="changeMonth(-1)">上個月</button>
          <button onclick="goToday()">今天</button>
          <button onclick="changeMonth(1)">下個月</button>
        </div>
        <div class="calendar-title" id="monthTitle">月份</div>
        <div class="actions">
          <button class="primary" onclick="openEvent(null, selectedDate)">新增選取日事件</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>
    <section class="layout">
      <div class="section">
        <div class="section-head">
          <div class="section-title" id="todaySectionTitle">今日待辦</div>
          <span class="pill todo" id="todayCount">0</span>
        </div>
        <div class="list" id="todayList"></div>
      </div>
      <div class="section">
        <div class="section-head">
          <div class="section-title">未來 7 天週清單</div>
          <span class="pill todo" id="weekCount">0</span>
        </div>
        <div class="list" id="weekList"></div>
      </div>
    </section>
  </main>

  <dialog id="eventDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="eventTitle">新增事件</div>
      <div class="form-grid">
        <div class="field"><label>案場</label><input id="eventProject"></div>
        <div class="field"><label>類型</label><select id="eventType"></select></div>
        <div class="field"><label>分類</label><select id="eventCategory"></select></div>
        <div class="field"><label>日期</label><input id="eventDate" type="date"></div>
        <div class="field"><label>時間</label><input id="eventTime" type="time"></div>
        <div class="field"><label>標題</label><input id="eventName"></div>
        <div class="field"><label>對象/廠商</label><input id="eventParty"></div>
        <div class="field"><label>地點</label><input id="eventPlace"></div>
        <div class="field"><label>狀態</label><select id="eventStatus"></select></div>
      </div>
      <div class="field"><label>關聯任務</label><input id="eventTask"></div>
      <div class="field" style="margin-top:12px;"><label>來源</label><input id="eventSource" readonly></div>
      <div class="field" style="margin-top:12px;"><label>提醒</label><input id="eventReminder"></div>
      <div class="field" style="margin-top:12px;"><label>備註</label><textarea id="eventNote"></textarea></div>
      <div class="modal-actions">
        <button value="cancel">取消</button>
        <button class="primary" value="ok">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="githubDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title">GitHub同步</div>
      <div class="small">Token 只存在此瀏覽器，不會寫進 HTML。</div>
      <div class="form-grid">
        <div class="field"><label>Repository</label><input id="ghRepo" placeholder="jammieaiwriter-jpg/highhand"></div>
        <div class="field"><label>Branch</label><input id="ghBranch" placeholder="main"></div>
        <div class="field"><label>資料路徑</label><input id="ghPath" placeholder="calendar/data/calendar_data.json"></div>
        <div class="field">
          <label>GitHub Token</label>
          <textarea id="ghToken" placeholder="貼上 GitHub fine-grained token，需 Contents read/write"></textarea>
          <div class="actions" style="margin-top:8px;">
            <button type="button" onclick="pasteGithubToken()">貼上Token</button>
            <button type="button" onclick="toggleGithubToken()">顯示/隱藏</button>
            <button type="button" onclick="clearGithubToken()">清除Token</button>
          </div>
        </div>
      </div>
      <div class="sync-note" id="syncStatus">第一次設定後，此瀏覽器會記住 Token。</div>
      <div class="modal-actions">
        <button value="close">關閉</button>
        <button type="button" onclick="saveGithubConfig()">儲存設定</button>
        <button type="button" onclick="loadFromGithub()">從GitHub載入</button>
        <button class="primary" type="button" onclick="saveToGithub()">儲存到GitHub</button>
      </div>
    </form>
  </dialog>

    let events = [];
    let activeId = null;
    let calendarMonth = todayISO().slice(0, 7);
    let selectedDate = todayISO();

    function localDateISO(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }
    function todayISO() { return localDateISO(new Date()); }
    function addDays(base, days) {
      const d = new Date(base + "T00:00:00");
      d.setDate(d.getDate() + days);
      return localDateISO(d);
    }
    function monthAdd(monthText, delta) {
      const d = new Date(monthText + "-01T00:00:00");
      d.setMonth(d.getMonth() + delta);
      return localDateISO(d).slice(0, 7);
    }
    function monthLabel(monthText) {
      const [year, month] = monthText.split("-");
      return `${year} 年 ${Number(month)} 月`;
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
    }
    function migrate(list) {
      return list.map((event, i) => ({
        id: String(event.id || i + 1),
        "案場": event["案場"] || "93H",
        "日期": event["日期"] || todayISO(),
        "時間": event["時間"] || "",
        "類型": event["類型"] || "提醒",
        "分類": event["分類"] || (String(event.id || "").startsWith("task-") ? "公司任務" : "公司提醒"),
        "來源": event["來源"] || (String(event.id || "").startsWith("task-") ? "progress" : "calendar"),
        "標題": event["標題"] || "",
        "對象/廠商": event["對象/廠商"] || "",
        "地點": event["地點"] || "",
        "關聯任務": event["關聯任務"] || "",
        "提醒": event["提醒"] || "",
        "備註": event["備註"] || "",
        "狀態": statuses.includes(event["狀態"]) ? event["狀態"] : "待辦",
        history: Array.isArray(event.history) ? event.history : []
      }));
    }
    function validDate(value) {
      const text = String(value || "").slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : "";
    }
    function taskTitle(task) {
      const title = task["追蹤事項"] || task["項目"] || "(未命名任務)";
      const trade = task["工項"] || "";
      return trade && !title.includes(trade) ? `${trade}｜${title}` : title;
    }
    function taskEventType(task) {
      const text = ["工項", "追蹤事項", "本週動作", "備註", "前置條件"].map(k => task[k] || "").join(" ");
      if (text.includes("會議")) return "會議";
      if (text.includes("送簽") || text.includes("總經理") || text.includes("用印")) return "送簽";
      if (text.includes("丈量") || text.includes("放樣")) return "丈量";
      if (text.includes("安裝") || text.includes("施作")) return "安裝";
      if (text.includes("進場") || text.includes("到料") || text.includes("入貨") || text.includes("進料")) return "進場";
      if (text.includes("回覆") || text.includes("確認") || text.includes("報價")) return "回覆";
      return "提醒";
    }
    function shouldSyncTask(task) {
      if (doneStatuses.includes(task["狀態"])) return false;
      if (task["原狀態"] === "歷史待複核") return false;
      if (!validDate(task["承諾日期"])) return false;
      return Boolean(taskTitle(task));
    }
    function taskToEvent(task, oldEvent) {
      const taskId = String(task["編號"] || "").trim();
      const oldHistory = oldEvent && Array.isArray(oldEvent.history) ? oldEvent.history : [];
      return {
        id: `task-${taskId}`,
        "案場": task["案場"] || "93H",
        "日期": validDate(task["承諾日期"]),
        "時間": "",
        "類型": taskEventType(task),
        "分類": "公司任務",
        "來源": "progress",
        "標題": taskTitle(task),
        "對象/廠商": task["廠商/負責人"] || "",
        "地點": "",
        "關聯任務": taskId,
        "提醒": [task["本週動作"], task["前置條件"]].filter(Boolean).join("；"),
        "備註": `由進度追蹤任務 #${taskId} 自動同步。${task["備註"] || ""}`,
        "狀態": oldEvent && doneStatuses.includes(oldEvent["狀態"]) ? oldEvent["狀態"] : "待辦",
        history: oldHistory.length ? oldHistory : [{time: new Date().toLocaleString("zh-TW"), type: "任務同步"}]
      };
    }
    function save() { localStorage.setItem("highhand-calendar-events", JSON.stringify(events)); }
    function load() {
      const saved = localStorage.getItem("highhand-calendar-events");
      events = migrate(saved ? JSON.parse(saved) : seedEvents);
      save();
      setupFilters();
      render();
    }
    function setupFilters() {
      const current = {
        project: document.getElementById("project").value,
        type: document.getElementById("type").value,
        category: document.getElementById("category").value,
        status: document.getElementById("status").value
      };
      const projects = [...new Set(events.map(x => x["案場"]).filter(Boolean))].sort();
      document.getElementById("project").innerHTML = '<option value="">全部案場</option>' + projects.map(x => `<option>${escapeHtml(x)}</option>`).join("");
      document.getElementById("project").value = projects.includes(current.project) ? current.project : "";
      document.getElementById("type").innerHTML = '<option value="">全部類型</option>' + eventTypes.map(x => `<option>${escapeHtml(x)}</option>`).join("");
      document.getElementById("type").value = eventTypes.includes(current.type) ? current.type : "";
      document.getElementById("category").innerHTML = '<option value="">全部分類</option>' + categories.map(x => `<option>${escapeHtml(x)}</option>`).join("");
      document.getElementById("category").value = categories.includes(current.category) ? current.category : "";
      document.getElementById("status").innerHTML = '<option value="">全部狀態</option>' + statuses.map(x => `<option>${escapeHtml(x)}</option>`).join("");
      document.getElementById("status").value = statuses.includes(current.status) ? current.status : "";
    }
    function isDone(event) { return ["完成", "取消"].includes(event["狀態"]); }
    function isOverdue(event) { return !isDone(event) && event["日期"] < todayISO(); }
    function baseFiltered() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const project = document.getElementById("project").value;
      const type = document.getElementById("type").value;
      const category = document.getElementById("category").value;
      const status = document.getElementById("status").value;
      const view = document.getElementById("view").value;
      const today = todayISO();
      const weekEnd = addDays(today, 7);
      return events.filter(event => {
        const hay = Object.values(event).join(" ").toLowerCase();
        if (q && !hay.includes(q)) return false;
        if (project && event["案場"] !== project) return false;
        if (type && event["類型"] !== type) return false;
        if (category && event["分類"] !== category) return false;
        if (status && event["狀態"] !== status) return false;
        if (view === "today" && event["日期"] !== today) return false;
        if (view === "week" && (event["日期"] < today || event["日期"] > weekEnd || isDone(event))) return false;
        if (view === "overdue" && !isOverdue(event)) return false;
        if (view === "done" && !isDone(event)) return false;
        return true;
      }).sort((a, b) => `${a["日期"]} ${a["時間"]}`.localeCompare(`${b["日期"]} ${b["時間"]}`));
    }
    function render() {
      const today = todayISO();
      const weekEnd = addDays(today, 7);
      const filtered = baseFiltered();
      const todayItems = filtered.filter(x => x["日期"] === today && !isDone(x));
      const weekItems = filtered.filter(x => x["日期"] >= today && x["日期"] <= weekEnd && !isDone(x));
      renderCalendar();
      document.getElementById("todaySectionTitle").textContent = "今日待辦";
      document.getElementById("todayCount").textContent = todayItems.length;
      document.getElementById("weekCount").textContent = weekItems.length;
      document.getElementById("todayList").innerHTML = todayItems.length ? todayItems.map(renderEvent).join("") : `<div class="empty">今天沒有待辦</div>`;
      document.getElementById("weekList").innerHTML = weekItems.length ? weekItems.map(renderEvent).join("") : `<div class="empty">未來 7 天沒有排程</div>`;
      document.getElementById("meta").textContent = `共 ${events.length} 筆事件，最後載入 ${new Date().toLocaleString("zh-TW")}`;
    }
    function renderCalendar() {
      document.getElementById("monthTitle").textContent = monthLabel(calendarMonth);
      const [year, month] = calendarMonth.split("-").map(Number);
      const first = new Date(year, month - 1, 1);
      const start = new Date(first);
      start.setDate(first.getDate() - first.getDay());
      const dayNames = ["日", "一", "二", "三", "四", "五", "六"];
      const cells = dayNames.map(name => `<div class="weekday">${name}</div>`);
      const q = document.getElementById("q").value.trim().toLowerCase();
      const project = document.getElementById("project").value;
      const type = document.getElementById("type").value;
      const category = document.getElementById("category").value;
      const status = document.getElementById("status").value;
      for (let i = 0; i < 42; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const iso = localDateISO(d);
        const inMonth = iso.slice(0, 7) === calendarMonth;
        const dayEvents = events.filter(event => {
          if (event["日期"] !== iso) return false;
          const hay = Object.values(event).join(" ").toLowerCase();
          if (q && !hay.includes(q)) return false;
          if (project && event["案場"] !== project) return false;
          if (type && event["類型"] !== type) return false;
          if (category && event["分類"] !== category) return false;
          if (status && event["狀態"] !== status) return false;
          return true;
        }).sort((a, b) => `${a["時間"]} ${a["標題"]}`.localeCompare(`${b["時間"]} ${b["標題"]}`));
        const openEvents = dayEvents.filter(event => !isDone(event));
        const classes = [
          "day",
          inMonth ? "" : "outside",
          iso === todayISO() ? "today" : "",
          iso === selectedDate ? "selected" : "",
          openEvents.some(event => isOverdue(event)) ? "overdue" : ""
        ].filter(Boolean).join(" ");
        const visible = dayEvents.slice(0, 3).map(event =>
          `<span class="day-event ${isDone(event) ? "done" : ""}">${escapeHtml((event["時間"] ? event["時間"] + " " : "") + event["標題"])}</span>`
        ).join("");
        cells.push(`<div class="${classes}" onclick="selectDate('${iso}')">
          <div class="day-num"><span>${d.getDate()}</span>${dayEvents.length ? `<span class="day-count">${dayEvents.length}件</span>` : ""}</div>
          ${visible}
          ${dayEvents.length > 3 ? `<div class="day-more">+${dayEvents.length - 3} 更多</div>` : ""}
        </div>`);
      }
      document.getElementById("calendarGrid").innerHTML = cells.join("");
    }
    function selectDate(dateText) {
      selectedDate = dateText;
      calendarMonth = dateText.slice(0, 7);
      document.getElementById("view").value = "all";
      document.getElementById("q").value = "";
      render();
      const items = events
        .filter(event => event["日期"] === dateText)
        .sort((a, b) => `${a["時間"]} ${a["標題"]}`.localeCompare(`${b["時間"]} ${b["標題"]}`));
      document.getElementById("todayList").innerHTML = items.length ? items.map(renderEvent).join("") : `<div class="empty">${dateText} 沒有事件</div>`;
      document.getElementById("todayCount").textContent = items.length;
      document.getElementById("todaySectionTitle").textContent = `${dateText} 事件`;
    }
    function changeMonth(delta) {
      calendarMonth = monthAdd(calendarMonth, delta);
      render();
    }
    function goToday() {
      selectedDate = todayISO();
      calendarMonth = selectedDate.slice(0, 7);
      render();
    }
    function renderEvent(event) {
      const cls = `${event["狀態"] === "完成" ? "done" : ""} ${event["狀態"] === "取消" ? "cancel" : ""} ${isOverdue(event) ? "overdue" : ""}`;
      return `<article class="event ${cls}">
        <div class="event-main">
          <div>
            <div class="event-title">${escapeHtml(event["標題"])}</div>
            <div class="event-meta">
              <span class="pill type">${escapeHtml(event["類型"])}</span>
              <span class="pill">${escapeHtml(event["分類"])}</span>
              <span class="pill ${event["狀態"] === "完成" ? "done" : event["狀態"] === "取消" ? "cancel" : "todo"}">${escapeHtml(event["狀態"])}</span>
              ${escapeHtml(event["案場"])}｜${escapeHtml(event["對象/廠商"])}｜${escapeHtml(event["地點"])}
            </div>
            <div class="event-meta">${escapeHtml(event["提醒"] || event["備註"] || "")}</div>
          </div>
          <div class="event-date">${escapeHtml(event["日期"])} ${escapeHtml(event["時間"])}</div>
        </div>
        <div class="event-actions">
          <button class="good" onclick="setStatus('${event.id}', '完成')">完成</button>
          <button class="warn" onclick="openEvent('${event.id}')">編輯</button>
          <button onclick="setStatus('${event.id}', '取消')">取消</button>
        </div>
      </article>`;
    }
    function nextId() { return String(Math.max(0, ...events.map(x => Number(x.id) || 0)) + 1); }
    function populateSelect(id, options, selected) {
      document.getElementById(id).innerHTML = options.map(x => `<option ${x === selected ? "selected" : ""}>${escapeHtml(x)}</option>`).join("");
    }
    function openEvent(id, presetDate) {
      activeId = id || null;
      const event = id ? events.find(x => x.id === id) : null;
      document.getElementById("eventTitle").textContent = id ? `編輯事件 #${id}` : "新增事件";
      document.getElementById("eventProject").value = event?.["案場"] || "93H";
      populateSelect("eventType", eventTypes, event?.["類型"] || "提醒");
      populateSelect("eventCategory", categories, event?.["分類"] || "公司提醒");
      document.getElementById("eventDate").value = event?.["日期"] || presetDate || selectedDate || todayISO();
      document.getElementById("eventTime").value = event?.["時間"] || "";
      document.getElementById("eventName").value = event?.["標題"] || "";
      document.getElementById("eventParty").value = event?.["對象/廠商"] || "";
      document.getElementById("eventPlace").value = event?.["地點"] || "";
      populateSelect("eventStatus", statuses, event?.["狀態"] || "待辦");
      document.getElementById("eventTask").value = event?.["關聯任務"] || "";
      document.getElementById("eventSource").value = event?.["來源"] || "calendar";
      document.getElementById("eventReminder").value = event?.["提醒"] || "";
      document.getElementById("eventNote").value = event?.["備註"] || "";
      document.getElementById("eventDialog").showModal();
    }
    document.getElementById("eventDialog").addEventListener("close", event => {
      if (event.target.returnValue !== "ok") return;
      let item = activeId ? events.find(x => x.id === activeId) : null;
      if (!item) {
        item = {id: nextId(), history: []};
        events.push(item);
      }
      Object.assign(item, {
        "案場": document.getElementById("eventProject").value.trim() || "93H",
        "日期": document.getElementById("eventDate").value || todayISO(),
        "時間": document.getElementById("eventTime").value,
        "類型": document.getElementById("eventType").value,
        "分類": document.getElementById("eventCategory").value,
        "來源": item["來源"] || document.getElementById("eventSource").value || "calendar",
        "標題": document.getElementById("eventName").value.trim(),
        "對象/廠商": document.getElementById("eventParty").value.trim(),
        "地點": document.getElementById("eventPlace").value.trim(),
        "關聯任務": document.getElementById("eventTask").value.trim(),
        "提醒": document.getElementById("eventReminder").value.trim(),
        "備註": document.getElementById("eventNote").value.trim(),
        "狀態": document.getElementById("eventStatus").value
      });
      item.history = item.history || [];
      item.history.push({time: new Date().toLocaleString("zh-TW"), type: activeId ? "編輯" : "新增"});
      save();
      setupFilters();
      render();
      activeId = null;
    });
    function setStatus(id, status) {
      const item = events.find(x => x.id === id);
      if (!item) return;
      item["狀態"] = status;
      item.history = item.history || [];
      item.history.push({time: new Date().toLocaleString("zh-TW"), type: status});
      save();
      render();
    }
    async function syncProgressTasks() {
      try {
        const response = await fetch("../progress/data/progress_data.json", {cache: "no-store"});
        if (!response.ok) throw new Error(`讀取進度資料失敗：HTTP ${response.status}`);
        const tasks = await response.json();
        const manualEvents = events.filter(event => event["來源"] !== "progress" && !String(event.id || "").startsWith("task-"));
        const oldTaskEvents = new Map(events.filter(event => event["來源"] === "progress" || String(event.id || "").startsWith("task-")).map(event => [event.id, event]));
        const taskEvents = tasks
          .filter(shouldSyncTask)
          .map(task => taskToEvent(task, oldTaskEvents.get(`task-${String(task["編號"] || "").trim()}`)));
        events = migrate(manualEvents.concat(taskEvents));
        events.sort((a, b) => `${a["日期"]} ${a["時間"]} ${a.id}`.localeCompare(`${b["日期"]} ${b["時間"]} ${b.id}`));
        save();
        setupFilters();
        render();
        alert(`已同步 ${taskEvents.length} 筆進度任務到行事曆。若要保存到雲端，請再按 GitHub同步 → 儲存到GitHub。`);
      } catch (err) {
        alert(err.message || String(err));
      }
    }
    function openGithubSync() {
      const config = getGithubConfig();
      document.getElementById("ghRepo").value = config.repo || "jammieaiwriter-jpg/highhand";
      document.getElementById("ghBranch").value = config.branch || "main";
      document.getElementById("ghPath").value = config.path || "calendar/data/calendar_data.json";
      document.getElementById("ghToken").value = config.token || "";
      document.getElementById("syncStatus").textContent = config.repo ? `目前設定：${config.repo} / ${config.path || "calendar/data/calendar_data.json"}` : "尚未設定 GitHub repo。";
      document.getElementById("githubDialog").showModal();
    }
    function getGithubConfig() {
      try { return JSON.parse(localStorage.getItem("highhand-calendar-github-config") || "{}"); }
      catch { return {}; }
    }
    function saveGithubConfig() {
      const config = {
        repo: document.getElementById("ghRepo").value.trim() || "jammieaiwriter-jpg/highhand",
        branch: document.getElementById("ghBranch").value.trim() || "main",
        path: document.getElementById("ghPath").value.trim() || "calendar/data/calendar_data.json",
        token: document.getElementById("ghToken").value.trim()
      };
      localStorage.setItem("highhand-calendar-github-config", JSON.stringify(config));
      document.getElementById("syncStatus").textContent = "設定已儲存。";
    }
    async function pasteGithubToken() {
      try {
        document.getElementById("ghToken").value = (await navigator.clipboard.readText()).trim();
        document.getElementById("syncStatus").textContent = "Token 已從剪貼簿貼上。";
      } catch {
        document.getElementById("syncStatus").textContent = "無法自動讀取剪貼簿，請手動貼上。";
      }
    }
    function toggleGithubToken() {
      const field = document.getElementById("ghToken");
      field.style.webkitTextSecurity = field.style.webkitTextSecurity === "disc" ? "none" : "disc";
      field.style.textSecurity = field.style.textSecurity === "disc" ? "none" : "disc";
    }
    function clearGithubToken() {
      const config = getGithubConfig();
      config.token = "";
      localStorage.setItem("highhand-calendar-github-config", JSON.stringify(config));
      document.getElementById("ghToken").value = "";
      document.getElementById("syncStatus").textContent = "Token 已清除。";
    }
    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(binary);
    }
    function base64ToUtf8(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    async function githubFetch(config, method, body) {
      if (!config.repo || !config.path || !config.token) throw new Error("請先填 Repository、資料路徑與 Token。");
      const url = `https://api.github.com/repos/${config.repo}/contents/${encodeURIComponent(config.path).replace(/%2F/g, "/")}`;
      const finalUrl = method === "GET" ? `${url}?ref=${encodeURIComponent(config.branch || "main")}` : url;
      const res = await fetch(finalUrl, {
        method,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${config.token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(body ? {"Content-Type": "application/json"} : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      if (!res.ok) {
        const text = await res.text();
        const error = new Error(`GitHub ${res.status}: ${text.slice(0, 220)}`);
        error.status = res.status;
        throw error;
      }
      return res.json();
    }
    async function loadFromGithub() {
      saveGithubConfig();
      const config = getGithubConfig();
      document.getElementById("syncStatus").textContent = "從 GitHub 載入中...";
      try {
        const file = await githubFetch(config, "GET");
        events = migrate(JSON.parse(base64ToUtf8(file.content)));
        save();
        setupFilters();
        render();
        document.getElementById("syncStatus").textContent = `已從 GitHub 載入 ${events.length} 筆。`;
      } catch (err) {
        document.getElementById("syncStatus").textContent = err.message;
      }
    }
    async function saveToGithub() {
      saveGithubConfig();
      const config = getGithubConfig();
      document.getElementById("syncStatus").textContent = "儲存到 GitHub 中...";
      try {
        let sha = null;
        try { sha = (await githubFetch(config, "GET")).sha; }
        catch (err) { if (err.status !== 404) throw err; }
        await githubFetch(config, "PUT", {
          message: `Update calendar data ${new Date().toLocaleString("zh-TW")}`,
          content: utf8ToBase64(JSON.stringify(events, null, 2)),
          branch: config.branch || "main",
          ...(sha ? {sha} : {})
        });
        document.getElementById("syncStatus").textContent = `已儲存 ${events.length} 筆到 GitHub。`;
      } catch (err) {
        document.getElementById("syncStatus").textContent = err.message;
      }
    }
    function exportCsv() {
      const rows = baseFiltered();
      const keys = ["id","案場","日期","時間","類型","分類","來源","標題","對象/廠商","地點","關聯任務","提醒","備註","狀態"];
      const csv = [keys.join(",")].concat(rows.map(row => keys.map(k => `"${String(row[k] ?? "").replace(/"/g, '""')}"`).join(","))).join("\n");
      const blob = new Blob(["\ufeff" + csv], {type: "text/csv;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Highhand行事曆排程.csv";
      a.click();

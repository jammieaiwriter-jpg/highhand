<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highhand 工地工具</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee7;
      --blue: #2266a5;
      --green: #027a48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 18px 20px;
    }
    .wrap {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }
    main {
      padding: 22px 0 36px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .tool {
      display: block;
      min-height: 170px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
    }
    .tool:hover {
      border-color: #9db8d2;
      box-shadow: 0 8px 24px rgba(31, 41, 51, .08);
    }
    .tool-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .tool-desc {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      color: var(--muted);
      margin-right: 6px;
      margin-bottom: 6px;
      background: #fff;
    }
    .tag.primary {
      color: var(--blue);
      border-color: #a6c8e7;
      background: #f0f7ff;
    }
    .tag.green {
      color: var(--green);
      border-color: #a6e7c7;
      background: #f3faf6;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      header { padding: 16px; }
      .wrap { width: calc(100vw - 24px); }
      .tool { min-height: 150px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Highhand 工地工具</h1>
      <div class="meta">工地進度追蹤、會勘紀錄與後續工具入口</div>
    </div>
  </header>
  <main class="wrap">
    <section class="grid">
      <a class="tool" href="./progress/">
        <div class="tool-title">進度追蹤</div>
        <div class="tool-desc">管理案場追蹤事項、完成、改期、變更、下一步任務與 GitHub 同步。</div>
        <span class="tag primary">93H</span>
        <span class="tag">多案場</span>
        <span class="tag green">手機可用</span>
      </a>
      <a class="tool" href="./meeting-records/">
        <div class="tool-title">工地會勘紀錄</div>
        <div class="tool-desc">建立會勘紀錄、整理巡視項目與輸出紀錄文件。</div>
        <span class="tag primary">會勘</span>
        <span class="tag">紀錄表</span>
      </a>
    </section>
  </main>
</body>
</html>

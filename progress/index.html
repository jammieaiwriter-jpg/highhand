<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>93H 進度追蹤</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee7;
      --blue: #2266a5;
      --red: #b42318;
      --orange: #b54708;
      --yellow: #8a6100;
      --green: #027a48;
      --gray: #475467;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
      font-size: 15px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
    }
    .top {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, input, select, textarea {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    button {
      min-height: 34px;
      padding: 0 10px;
      cursor: pointer;
      color: var(--ink);
    }
    button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
    button.good { color: #fff; background: var(--green); border-color: var(--green); }
    button.warn { color: #fff; background: var(--orange); border-color: var(--orange); }
    button.ghost { background: transparent; }
    main { max-width: 1480px; margin: 0 auto; padding: 16px 20px 32px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(7, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 10px 12px;
      min-height: 70px;
    }
    .stat .num { font-size: 23px; font-weight: 700; line-height: 1.1; }
    .stat .label { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .toolbar {
      display: grid;
      grid-template-columns: 1.3fr repeat(5, minmax(130px, 200px));
      gap: 10px;
      margin-bottom: 12px;
    }
    input, select { min-height: 36px; padding: 0 10px; width: 100%; }
    textarea { width: 100%; min-height: 86px; padding: 10px; resize: vertical; }
    #ghToken {
      min-height: 76px;
      font-family: Consolas, "Segoe UI", monospace;
      -webkit-text-security: disc;
      text-security: disc;
    }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
    }
    table { border-collapse: collapse; width: 100%; min-width: 1420px; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 3; background: #eef3f8; font-size: 13px; }
    tr.done { background: #f3faf6; color: #667085; }
    tr.cancel { background: #f6f7f9; color: #667085; }
    tr.manager { background: #eef6ff; }
    tr.overdue { box-shadow: inset 4px 0 0 #d92d20; }
    tr.soon { box-shadow: inset 4px 0 0 #f79009; }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 3px 8px;
      font-size: 12px;
      white-space: nowrap;
      margin: 0 4px 4px 0;
    }
    .pill.todo { color: var(--blue); border-color: #a6c8e7; }
    .pill.running { color: var(--orange); border-color: #fed7aa; }
    .pill.done { color: var(--green); border-color: #a6e7c7; }
    .pill.cancel { color: var(--gray); border-color: #cfd4dc; }
    .pill.rescheduled { color: var(--yellow); border-color: #fde68a; }
    .pill.manager { color: var(--blue); border-color: #93c5fd; background: #eff6ff; }
    .pill.overdue { color: var(--red); border-color: #f3b8b1; }
    .small { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; min-width: 218px; }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    dialog {
      width: min(720px, calc(100vw - 24px));
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
    }
    dialog::backdrop { background: rgba(15, 23, 42, .35); }
    .modal-body { padding: 18px; }
    .modal-title { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 5px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
    .history-list { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
    .history-entry { padding: 10px; border-bottom: 1px solid var(--line); }
    .history-entry:last-child { border-bottom: 0; }
    .sync-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
    }
    @media (max-width: 1000px) {
      .top { align-items: flex-start; flex-direction: column; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .toolbar { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      main, header { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <h1>93H 進度追蹤</h1>
        <div class="meta" id="meta">任務流轉版：完成、改期、變更與新增下一步會存在此瀏覽器，可匯出 CSV 備份。</div>
      </div>
      <div class="actions">
        <button onclick="reload()">重新整理</button>
        <button onclick="openNewTask()">新增任務</button>
        <button onclick="openGithubSync()">GitHub同步</button>
        <button onclick="exportCsv()">匯出CSV</button>
        <button onclick="resetLocal()">還原初始資料</button>
      </div>
    </div>
  </header>
  <main>
    <section class="summary" id="summary"></section>
    <section class="toolbar">
      <input id="q" placeholder="搜尋：案場、追蹤事項、廠商、備註、異動紀錄" oninput="render()" />
      <select id="project" onchange="render()"></select>
      <select id="status" onchange="render()"></select>
      <select id="trade" onchange="render()"></select>
      <select id="owner" onchange="render()"></select>
      <select id="view" onchange="render()">
        <option value="active">未完成優先</option>
        <option value="urgent">只看逾期/三日內</option>
        <option value="manager">只看總經理</option>
        <option value="all">全部</option>
        <option value="done">只看完成/取消</option>
      </select>
    </section>
    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:64px;">編號</th>
            <th style="width:140px;">狀態</th>
            <th style="width:120px;">承諾日期</th>
            <th style="width:100px;">案場</th>
            <th style="width:120px;">工項</th>
            <th style="width:360px;">追蹤事項</th>
            <th style="width:140px;">負責</th>
            <th style="width:220px;">本週動作</th>
            <th style="width:250px;">前置/備註</th>
            <th style="width:235px;">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>

  <dialog id="completeDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="completeTitle">完成任務</div>
      <div class="small" id="completeDesc"></div>
      <div class="form-grid">
        <div class="field">
          <label>完成備註</label>
          <textarea id="completeNote" placeholder="例：已完成報價，LINE 已回傳。"></textarea>
        </div>
        <div class="field">
          <label>下一步</label>
          <select id="nextStepSelect" onchange="handleNextPresetChange()"></select>
          <label style="margin-top:10px;">其他下一步</label>
          <input id="nextStepOther" placeholder="若選其他，請輸入任務名稱" />
        </div>
        <div class="field">
          <label>下一步日期</label>
          <input id="nextDueDate" type="date" />
        </div>
        <div class="field">
          <label>下一步負責</label>
          <select id="nextOwner"></select>
        </div>
      </div>
      <div class="modal-actions">
        <button value="cancel">取消</button>
        <button class="good" value="done_only">只標完成</button>
        <button class="primary" value="done_next">完成並新增下一步</button>
      </div>
    </form>
  </dialog>

  <dialog id="rescheduleDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="rescheduleTitle">改期</div>
      <div class="small" id="rescheduleDesc"></div>
      <div class="form-grid">
        <div class="field">
          <label>新日期</label>
          <input id="newDueDate" type="date" />
          <div class="small">有填日期：狀態改為待辦；未填日期：狀態改為待排程。</div>
        </div>
        <div class="field">
          <label>改期原因</label>
          <textarea id="rescheduleReason" placeholder="例：廠商回覆材料未到，日期待確認。"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button value="cancel">取消</button>
        <button class="warn" value="ok">確認改期</button>
      </div>
    </form>
  </dialog>

  <dialog id="editDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="editTitle">變更任務</div>
      <div class="form-grid">
        <div class="field"><label>狀態</label><select id="editStatus"></select></div>
        <div class="field"><label>承諾日期</label><input id="editDueDate" type="date" /></div>
        <div class="field"><label>案場</label><input id="editProject" /></div>
        <div class="field"><label>工項</label><input id="editTrade" /></div>
        <div class="field"><label>負責</label><select id="editOwner"></select></div>
        <div class="field"><label>追蹤事項</label><input id="editTask" /></div>
      </div>
      <div class="field"><label>本週動作</label><input id="editAction" /></div>
      <div class="field" style="margin-top:12px;"><label>變更備註</label><textarea id="editNote"></textarea></div>
      <div class="modal-actions">
        <button value="cancel">取消</button>
        <button class="primary" value="ok">儲存變更</button>
      </div>
    </form>
  </dialog>

  <dialog id="calendarDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="calendarTitle">轉到行事曆</div>
      <div class="small" id="calendarDesc"></div>
      <div class="form-grid">
        <div class="field"><label>日期</label><input id="calendarDate" type="date" /></div>
        <div class="field"><label>時間</label><input id="calendarTime" type="time" /></div>
        <div class="field"><label>類型</label><select id="calendarType"></select></div>
        <div class="field"><label>分類</label><select id="calendarCategory"></select></div>
        <div class="field"><label>標題</label><input id="calendarName" /></div>
        <div class="field"><label>轉出後任務處理</label><select id="calendarTaskMode">
          <option value="keep">保留在任務追蹤</option>
          <option value="cancel">從任務追蹤移除/取消</option>
        </select></div>
      </div>
      <div class="field"><label>提醒</label><input id="calendarReminder" /></div>
      <div class="field" style="margin-top:12px;"><label>備註</label><textarea id="calendarNote"></textarea></div>
      <div class="sync-note" id="calendarSyncStatus">會寫入 GitHub 的 calendar/data/calendar_data.json。</div>
      <div class="modal-actions">
        <button value="cancel">取消</button>
        <button class="primary" value="ok">轉到行事曆</button>
      </div>
    </form>
  </dialog>

  <dialog id="historyDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title" id="historyTitle">異動紀錄</div>
      <div class="history-list" id="historyList"></div>
      <div class="modal-actions"><button value="ok">關閉</button></div>
    </form>
  </dialog>

  <dialog id="githubDialog">
    <form method="dialog" class="modal-body">
      <div class="modal-title">GitHub同步</div>
      <div class="small">設定一次後會存在此瀏覽器。Token 只存在 localStorage，不會寫進 HTML。</div>
      <div class="form-grid">
        <div class="field">
          <label>Repository</label>
          <input id="ghRepo" placeholder="jammieaiwriter-jpg/highhand" />
        </div>
        <div class="field">
          <label>Branch</label>
          <input id="ghBranch" placeholder="main" />
        </div>
        <div class="field">
          <label>資料路徑</label>
          <input id="ghPath" placeholder="progress/data/progress_data.json" />
        </div>
        <div class="field">
          <label>GitHub Token</label>
          <textarea id="ghToken" placeholder="貼上 GitHub fine-grained token，需 Contents read/write"></textarea>
          <div class="actions" style="margin-top:8px;">
            <button type="button" onclick="pasteGithubToken()">貼上Token</button>
            <button type="button" onclick="toggleGithubToken()">顯示/隱藏</button>
            <button type="button" onclick="clearGithubToken()">清除Token</button>
          </div>
        </div>
      </div>
      <div class="sync-note" id="syncStatus">第一次設定後，此瀏覽器會記住 Token。換手機或換瀏覽器時才需要重貼。</div>
      <div class="modal-actions">
        <button value="close">關閉</button>
        <button type="button" onclick="saveGithubConfig()">儲存設定</button>
        <button type="button" onclick="loadFromGithub()">從GitHub載入</button>
        <button class="primary" type="button" onclick="saveToGithub()">儲存到GitHub</button>
      </div>
    </form>
  </dialog>

        if (owner && item["廠商/負責人"] !== owner) return false;
        if (view === "urgent" && !["overdue", "soon"].includes(dueKind(item))) return false;
        if (view === "manager" && item["狀態"] !== "總經理") return false;
        if (view === "done" && !isDone(item)) return false;
        if (view === "active" && isDone(item)) return false;
        return true;
      }).sort((a, b) => {
        const w = {"總經理": 0, "待辦": 1, "進行中": 2, "改期": 3, "待排程": 4, "完成": 8, "取消": 9};
        const dueA = dueKind(a) === "overdue" ? -2 : dueKind(a) === "soon" ? -1 : 0;
        const dueB = dueKind(b) === "overdue" ? -2 : dueKind(b) === "soon" ? -1 : 0;
        return dueA - dueB
          || (w[a["狀態"]] ?? 5) - (w[b["狀態"]] ?? 5)
          || String(a["承諾日期"] || "9999").localeCompare(String(b["承諾日期"] || "9999"))
          || Number(a["編號"]) - Number(b["編號"]);
      });
    }

      await githubFetch(config, "PUT", {

        ...(sha ? {sha} : {})

    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }
    function base64ToUtf8(base64) {
      const binary = atob(base64.replace(/\s/g, ""));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }
    async function githubFetch(config, method, body) {
      if (!config.repo || !config.path || !config.token) throw new Error("請先填 Repository、資料路徑與 Token。");
      const url = `https://api.github.com/repos/${config.repo}/contents/${encodeURIComponent(config.path).replace(/%2F/g, "/")}`;
      const finalUrl = method === "GET" ? `${url}?ref=${encodeURIComponent(config.branch || "main")}` : url;
      const res = await fetch(finalUrl, {
        method,
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${config.token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(body ? {"Content-Type": "application/json"} : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
      if (!res.ok) {
        const text = await res.text();
        const error = new Error(`GitHub ${res.status}: ${text.slice(0, 220)}`);
        error.status = res.status;
        throw error;
      }
      return res.json();
    }

      URL.revokeObjectURL(url);
    }
    reload();
  </script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>工地會勘紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --cream: #f5f0e8;
  --cream2: #ede7d9;
  --ink: #1c1a16;
  --ink2: #4a4640;
  --ink3: #8a8278;
  --red: #c0392b;
  --green: #2e7d52;
  --blue: #1a4a7a;
  --gold: #b8860b;
  --border: #c8bfaf;
  --surface: #faf7f2;
  --shadow: rgba(28,26,22,0.12);
  --r: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ══ Header ══ */
header {
  background: var(--ink);
  color: var(--cream);
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: 0 2px 12px var(--shadow);
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-badge {
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 3px 8px;
  border-radius: 3px;
}
.header-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
}
#headerClock {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #aaa;
}

/* ══ Tab bar ══ */
.tabbar {
  background: var(--ink);
  border-top: 1px solid #2a2820;
  display: flex;
  position: sticky;
  top: 52px;
  z-index: 190;
}
.tab {
  flex: 1;
  padding: 8px 4px 7px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: #666;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.tab.active { color: var(--cream); border-bottom-color: var(--red); }
.tab .tab-num {
  display: inline-block;
  background: var(--red);
  color: #fff;
  border-radius: 10px;
  padding: 0 5px;
  font-size: 10px;
  margin-left: 4px;
  min-width: 16px;
  text-align: center;
}

/* ══ Pages ══ */
.page { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
.page.active { display: flex; }

/* ══ SETUP PAGE ══ */
#pageSetup {
  padding: 0;
  gap: 0;
}

.setup-section {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Noto Serif TC', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  padding-bottom: 8px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 4px;
}
.section-heading .icon { font-size: 16px; }

.form-row { display: flex; gap: 10px; }
.form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
.form-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.form-input {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  color: var(--ink);
  font-size: 14px;
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.form-input:focus { border-color: var(--blue); }

/* Agenda import */
.agenda-box {
  background: var(--surface);
  border: 1.5px dashed var(--border);
  border-radius: var(--r);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.agenda-box textarea {
  background: transparent;
  border: none;
  outline: none;
  font-size: 13px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  resize: none;
  min-height: 120px;
  line-height: 1.8;
  width: 100%;
}
.agenda-hint {
  font-size: 11px;
  color: var(--ink3);
  line-height: 1.6;
  background: var(--cream2);
  border-radius: 6px;
  padding: 8px 10px;
}
.agenda-hint strong { color: var(--blue); }
.agenda-preview {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.agenda-preview-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 5px 8px;
  background: var(--cream);
  border-radius: 4px;
  border-left: 3px solid var(--blue);
}
.agenda-preview-item .num { font-weight: 700; color: var(--blue); font-size: 11px; min-width: 16px; }

.btn-parse {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-parse:active { opacity: 0.85; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 4px 0;
}

.btn-start {
  margin: 0 16px 20px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Noto Serif TC', serif;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 4px 16px rgba(192,57,43,0.3);
  transition: all 0.15s;
}
.btn-start:active { transform: scale(0.97); }

/* ══ AGENDA PAGE ══ */
#pageAgenda {
  padding: 12px 14px 80px;
  gap: 10px;
}

.agenda-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
  box-shadow: 0 1px 4px var(--shadow);
}
.agenda-card.done { border-color: var(--green); }
.agenda-card.done .agenda-card-header { background: #f0faf4; }

.agenda-card-header {
  padding: 11px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--cream2);
  border-bottom: 1px solid var(--border);
}
.agenda-card-num {
  min-width: 28px; height: 28px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900;
  flex-shrink: 0;
  margin-top: 1px;
}
.agenda-card.done .agenda-card-num { background: var(--green); }
.agenda-card-topic { font-size: 14px; font-weight: 600; line-height: 1.5; flex: 1; }
.agenda-card-status {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-pending { background: #fff3e0; color: #c67c00; }
.status-done { background: #e8f5e9; color: var(--green); }

.agenda-card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

.field-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.conclusion-area {
  background: var(--cream);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  font-size: 14px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  resize: none;
  outline: none;
  min-height: 80px;
  line-height: 1.6;
  width: 100%;
  transition: border-color 0.2s;
}
.conclusion-area:focus { border-color: var(--blue); background: #fff; }

/* Photo row */
.photo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.photo-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  background: var(--cream);
  color: var(--ink2);
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.photo-btn:active { background: var(--cream2); }
.photo-thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.photo-thumb-wrap {
  position: relative;
  display: inline-block;
}
.photo-thumb {
  width: 60px; height: 60px;
  object-fit: cover;
  border-radius: 6px;
  border: 2px solid var(--border);
  cursor: pointer;
  display: block;
}
.photo-del {
  position: absolute;
  top: -5px; right: -5px;
  width: 18px; height: 18px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}

/* card actions */
.card-actions { display: flex; gap: 8px; }
.btn-card-done {
  flex: 1;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 10px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-card-done:active { opacity: 0.85; }
.btn-card-del {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  padding: 2px 4px;
  opacity: 0.4;
  transition: opacity 0.15s;
  flex-shrink: 0;
}
.btn-card-del:hover { opacity: 1; }
.btn-card-undo {
  background: var(--cream2);
  color: var(--ink2);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

/* Add extra item */
.btn-add-extra {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  border: 2px dashed var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--ink3);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
}
.btn-add-extra:hover { border-color: var(--blue); color: var(--blue); }

/* floating finish */
.float-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  border-top: 1px solid #333;
  padding: 10px 14px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 180;
}
.float-progress {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.float-progress-label { font-size: 11px; color: #888; font-weight: 600; }
.float-progress-bar {
  height: 5px;
  background: #333;
  border-radius: 3px;
  overflow: hidden;
}
.float-progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.btn-float-finish {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 11px 20px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(192,57,43,0.4);
  transition: all 0.15s;
}
.btn-float-finish:active { transform: scale(0.96); }

/* ══ REPORT PAGE ══ */
#pageReport { padding: 0; }

.report-toolbar {
  background: var(--ink);
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 1px solid #333;
}
.btn-rtool {
  padding: 8px 14px;
  border-radius: var(--r);
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  border: none;
}
.btn-rtool.primary { background: var(--red); color: #fff; }
.btn-rtool.secondary { background: #2a2820; color: #ccc; border: 1px solid #444; }
.btn-rtool:active { opacity: 0.8; }

.report-scroll { flex: 1; overflow-y: auto; padding: 14px; }

/* ── Report Document ── */
.rdoc {
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  font-family: 'Noto Sans TC', sans-serif;
  color: #1c1a16;
  max-width: 800px;
  margin: 0 auto;
}

.rdoc-cover {
  background: var(--ink);
  color: #f5f0e8;
  padding: 28px 28px 24px;
  border-bottom: 4px solid var(--red);
}
.rdoc-cover-badge {
  display: inline-block;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 3px 10px;
  border-radius: 2px;
  margin-bottom: 10px;
}
.rdoc-cover-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.rdoc-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 24px;
  font-size: 12px;
  opacity: 0.85;
}
.rdoc-meta-grid dt { color: #aaa; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1px; }
.rdoc-meta-grid dd { font-weight: 600; color: #f5f0e8; }

.rdoc-body { padding: 0; }

.rdoc-item {
  border-bottom: 1px solid #e8e2d8;
  padding: 18px 24px;
}
.rdoc-item:last-child { border-bottom: none; }
.rdoc-item-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.rdoc-item-num {
  width: 30px; height: 30px;
  background: #1c1a16;
  color: #f5f0e8;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900;
  flex-shrink: 0;
}
.rdoc-item-topic {
  flex: 1;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
  padding-top: 4px;
}
.rdoc-item-extra { font-size: 10px; letter-spacing: 1px; color: #999; margin-top: 2px; }
.rdoc-status-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-done { background: #e8f5e9; color: #2e7d52; }
.badge-pending { background: #fff3e0; color: #c67c00; }
.badge-extra { background: #e8eaf6; color: #3f51b5; }

.rdoc-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.rdoc-section-label::after { content:''; flex: 1; height: 1px; background: #e8e2d8; }

.rdoc-conclusion-box {
  background: #f8f6f0;
  border-left: 3px solid #1c1a16;
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.7;
  color: #1c1a16;
  white-space: pre-wrap;
  margin-bottom: 12px;
}
.rdoc-conclusion-box.empty { color: #bbb; font-style: italic; }

.rdoc-photos {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.rdoc-photo {
  width: 110px; height: 85px;
  object-fit: cover;
  border-radius: 5px;
  border: 1px solid #ddd;
  cursor: pointer;
}

.rdoc-footer {
  background: #f8f6f0;
  border-top: 2px solid #ddd;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.rdoc-sig {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.rdoc-sig-line { width: 110px; border-top: 1.5px solid #1c1a16; padding-top: 6px; font-size: 11px; color: #555; }
.rdoc-footer-note { font-size: 11px; color: #999; }

/* ══ Modals ══ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.overlay.open { display: flex; }
.overlay img { max-width: 100%; max-height: 85vh; border-radius: 8px; object-fit: contain; }
#pdfModal {
  align-items: stretch;
  justify-content: stretch;
  padding: 0;
  flex-direction: column;
}
.editor-box {
  width: min(100%, 980px);
  height: min(100%, 92vh);
  background: #121212;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.editor-toolbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px;
  background: #1c1a16;
  border-bottom: 1px solid #333;
}
.editor-btn {
  border: 1px solid #555;
  background: #2a2820;
  color: #f5f0e8;
  border-radius: 6px;
  padding: 8px 10px;
  font: 700 13px 'Noto Sans TC', sans-serif;
  cursor: pointer;
}
.editor-btn.active { background: var(--red); border-color: var(--red); }
.editor-input {
  min-width: 160px;
  flex: 1;
  border: 1px solid #555;
  background: #faf7f2;
  color: #1c1a16;
  border-radius: 6px;
  padding: 8px 10px;
  font: 600 13px 'Noto Sans TC', sans-serif;
}
.editor-canvas-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: #0b0b0b;
}
#photoEditorCanvas {
  max-width: 100%;
  max-height: 100%;
  background: #fff;
  touch-action: none;
}
.photo-edit {
  position: absolute;
  left: 3px;
  bottom: 3px;
  width: auto;
  min-width: 30px;
  height: 24px;
  border: none;
  border-radius: 5px;
  background: rgba(26,74,122,0.92);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  padding: 0 6px;
}

/* Add item modal */
.modal-box {
  background: var(--surface);
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  font-weight: 700;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 10px;
}
.modal-actions { display: flex; gap: 8px; }
.btn-modal-ok {
  flex: 1;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 11px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}
.btn-modal-cancel {
  background: var(--cream2);
  color: var(--ink2);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 11px 16px;
  font-size: 14px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink);
  border: 1px solid #444;
  border-radius: 24px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--cream);
  z-index: 600;
  opacity: 0;
  transition: all 0.3s;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

input[type="file"] { display: none; }

@media print {
  .tabbar, .report-toolbar, .float-bar, .overlay, .toast { display: none !important; }
  #pageSetup, #pageAgenda { display: none !important; }
  #pageReport { display: block !important; }
  .report-scroll { overflow: visible !important; }
  body { background: white !important; }
}

</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-badge">會勘</div>
    <div class="header-title">工地巡視紀錄</div>
  </div>

      <textarea id="agendaInput" placeholder="例：&#10;1. 主體結構鋼筋綁紮進度確認&#10;2. B2 地下室防水施工現況&#10;3. 施工動線安全措施&#10;4. 廠商進場時間協調&#10;…"></textarea>

    iPhone 用戶：點「⬇ 下載」→ 長按 → 「儲存到檔案」或「分享」
  </div>
  <iframe id="pdfFrame" style="flex:1;border:none;background:#fff;"></iframe>

<script>
// ══ State ══
let session = {
  unit: '', officer: '', escort: '', date: '', org: '',
  startTime: null, endTime: null,
  items: []   // { id, topic, isExtra, conclusion, photos:[], done }
};

let itemPhotoInputs = {};
const AGENDA_SAVE_KEY = 'agenda_autosave_v1';

// ══ localStorage helpers ══
function saveSession() {
  try {
    const data = JSON.stringify({
      ...session,
      startTime: session.startTime ? session.startTime.toISOString() : null,
      endTime: session.endTime ? session.endTime.toISOString() : null,
    });
    localStorage.setItem(AGENDA_SAVE_KEY, data);
  } catch(e) { /* storage full, skip */ }
}

function loadSession() {
  try {
    const raw = localStorage.getItem(AGENDA_SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d.unit) return null;
    d.startTime = d.startTime ? new Date(d.startTime) : null;
    d.endTime = d.endTime ? new Date(d.endTime) : null;
    return d;
  } catch(e) { return null; }
}

function clearSession() { localStorage.removeItem(AGENDA_SAVE_KEY); }

// ══ Clock ══
setInterval(() => {
  const n = new Date();
  document.getElementById('headerClock').textContent =
    `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}, 1000);
function pad(n){ return String(n).padStart(2,'0'); }

// ══ Tab ══
function switchTab(t) {
  ['setup','agenda','report'].forEach(id => {
    document.getElementById('page'+cap(id)).classList.toggle('active', id===t);
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  document.getElementById('floatBar').style.display = t==='agenda' ? 'flex' : 'none';
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// ══ Parse agenda ══
function parseAgenda() {
  const raw = document.getElementById('agendaInput').value.trim();
  if (!raw) { showToast('請輸入討論事項'); return; }
  const lines = raw.split('\n')
    .map(l => l.replace(/^[\d一二三四五六七八九十]+[.、．\)）\s]+/, '').trim())
    .filter(l => l.length > 0);
  document.getElementById('parseCount').textContent = lines.length;
  const preview = document.getElementById('agendaPreview');
  preview.innerHTML = lines.map((l,i) => `
    <div class="agenda-preview-item">
      <span class="num">${i+1}</span>
      <span>${escHtml(l)}</span>
    </div>`).join('');
  showToast(`✅ 解析完成，共 ${lines.length} 項`);
  // Store parsed
  preview._lines = lines;
}

// ══ Start ══
function startSession() {
  const unit = document.getElementById('iUnit').value.trim();
  const officer = document.getElementById('iOfficer').value.trim();
  if (!unit || !officer) { showToast('請填寫巡視單位及長官'); return; }

  const preview = document.getElementById('agendaPreview');
  const lines = (preview._lines || []);

  session = {
    unit, officer,
    escort: document.getElementById('iEscort').value.trim(),
    date: document.getElementById('iDate').value || fmtDate(new Date()),
    org: document.getElementById('iOrg').value.trim(),
    startTime: new Date(),
    endTime: null,
    items: lines.map((t,i) => ({
      id: i+1, topic: t, isExtra: false,
      conclusion: '', photos: [], done: false
    }))
  };

  if (session.items.length === 0) {
    // Allow empty agenda - start with blank
    session.items = [];
  }

  renderAgenda();
  updateProgress();
  document.getElementById('doneCount').textContent = session.items.length;
  saveSession();
  switchTab('agenda');
}

// ══ Render Agenda ══
function renderAgenda() {
  const container = document.getElementById('agendaCards');
  container.innerHTML = '';
  itemPhotoInputs = {};
  session.items.forEach(item => appendCard(item, container));
  // Add extra button
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-extra';
  addBtn.id = 'btnAddExtra';
  addBtn.innerHTML = '＋ 新增現場臨時事項';
  addBtn.onclick = openAddModal;
  container.appendChild(addBtn);
}

function appendCard(item, container) {
  const card = document.createElement('div');
  card.className = 'agenda-card' + (item.done ? ' done' : '');
  card.id = `card-${item.id}`;

  const statusLabel = item.done ? '已完成' : '待紀錄';
  const statusClass = item.done ? 'status-done' : 'status-pending';
  const extraBadge = item.isExtra ? ' <span style="font-size:10px;color:#888;">（臨時新增）</span>' : '';

  card.innerHTML = `
    <div class="agenda-card-header">
      <div class="agenda-card-num">${item.id}</div>
      <div class="agenda-card-topic">${escHtml(item.topic)}${extraBadge}</div>
      <div class="agenda-card-status ${statusClass}">${statusLabel}</div>
      <button class="btn-card-del" onclick="deleteItem(${item.id})" title="刪除此項">🗑</button>
    </div>
    <div class="agenda-card-body">
      <div>
        <div class="field-label">現場結論 / 指示事項</div>
        <textarea class="conclusion-area" id="conc-${item.id}" placeholder="輸入現場結論、指示或備注…">${escHtml(item.conclusion)}</textarea>
      </div>
      <div>
        <div class="field-label">現場照片</div>
        <div class="photo-row">
          <label class="photo-btn">
            📷 拍照
            <input type="file" id="cam-${item.id}" accept="image/*" capture="environment" onchange="handlePhotoInput(event, ${item.id})">
          </label>
          <label class="photo-btn">
            🖼 相簿
            <input type="file" id="gal-${item.id}" accept="image/*" onchange="handlePhotoInput(event, ${item.id})">
          </label>
        </div>
        <div class="photo-thumbs" id="thumbs-${item.id}"></div>
      </div>
      <div class="card-actions">
        ${item.done
          ? `<button class="btn-card-undo" onclick="undoneItem(${item.id})">↺ 重新開啟</button>`
          : `<button class="btn-card-done" onclick="doneItem(${item.id})">✔ 完成此項</button>`
        }
      </div>
    </div>
  `;
  // Insert before add button
  const addBtn = document.getElementById('btnAddExtra');
  if (addBtn) container.insertBefore(card, addBtn);
  else container.appendChild(card);

  // Restore photos
  item.photos.forEach((src, pi) => addThumb(item.id, src, pi));

  // Bind textarea autosave
  document.getElementById(`conc-${item.id}`).addEventListener('input', e => {
    item.conclusion = e.target.value;
    saveSession();
  });
}

// ══ Photo ══
function handlePhotoInput(e, itemId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const item = session.items.find(i => i.id === itemId);
    if (!item) return;
    const src = await resizePhotoDataUrl(ev.target.result);
    item.photos.push(src);
    addThumb(itemId, src, item.photos.length - 1);
    e.target.value = '';
    saveSession();
  };
  reader.readAsDataURL(file);
}

function resizePhotoDataUrl(src, maxSide = 1600, quality = 0.86) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

function addThumb(itemId, src, photoIdx) {
  const container = document.getElementById(`thumbs-${itemId}`);
  if (!container) return;
  const wrap = document.createElement('div');
  wrap.className = 'photo-thumb-wrap';
  wrap.id = `thumb-${itemId}-${photoIdx}`;
  wrap.innerHTML = `
    <img class="photo-thumb" src="${src}" onclick="openImg('${itemId}','${photoIdx}')" />
    <button class="photo-edit" onclick="openPhotoEditor(${itemId},${photoIdx})">標註</button>
    <button class="photo-del" onclick="delPhoto(${itemId},${photoIdx})">✕</button>
  `;
  container.appendChild(wrap);
}

function delPhoto(itemId, photoIdx) {
  if (!confirm('確定要刪除這張照片？')) return;
  const item = session.items.find(i => i.id === itemId);
  if (!item) return;
  item.photos.splice(photoIdx, 1);
  const container = document.getElementById(`thumbs-${itemId}`);
  container.innerHTML = '';
  item.photos.forEach((src, pi) => addThumb(itemId, src, pi));
  saveSession();
}

function openImg(itemId, photoIdx) {
  const item = session.items.find(i => i.id == itemId);
  if (!item) return;
  document.getElementById('overlayImg').src = item.photos[photoIdx];
  document.getElementById('imgOverlay').classList.add('open');
}

let editorState = {
  itemId: null,
  photoIdx: null,
  image: null,
  tool: 'rect',
  marks: [],
  start: null,
  draft: null
};

function setEditTool(tool) {
  editorState.tool = tool;
  ['Rect','Circle','Arrow','Text'].forEach(name => {
    document.getElementById(`tool${name}`).classList.toggle('active', tool === name.toLowerCase());
  });
}

function openPhotoEditor(itemId, photoIdx) {
  const item = session.items.find(i => i.id === itemId);
  if (!item || !item.photos[photoIdx]) return;
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById('photoEditorCanvas');
    const maxW = 1600;
    const scale = Math.min(1, maxW / img.naturalWidth);
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    editorState = { itemId, photoIdx, image: img, tool: editorState.tool || 'rect', marks: [], start: null, draft: null };
    drawEditorCanvas();
    document.getElementById('photoEditorModal').classList.add('open');
  };
  img.src = item.photos[photoIdx];
}

function closePhotoEditor() {
  document.getElementById('photoEditorModal').classList.remove('open');
  editorState.start = null;
  editorState.draft = null;
}

function getCanvasPoint(ev) {
  const canvas = document.getElementById('photoEditorCanvas');
  const rect = canvas.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left) * canvas.width / rect.width,
    y: (ev.clientY - rect.top) * canvas.height / rect.height
  };
}

function drawArrow(ctx, x1, y1, x2, y2) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const head = 24;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

function drawMark(ctx, mark) {
  ctx.save();
  ctx.strokeStyle = '#d81e1e';
  ctx.fillStyle = '#d81e1e';
  ctx.lineWidth = 8;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (mark.tool === 'rect') {
    ctx.strokeRect(mark.x1, mark.y1, mark.x2 - mark.x1, mark.y2 - mark.y1);
  } else if (mark.tool === 'circle') {
    const cx = (mark.x1 + mark.x2) / 2;
    const cy = (mark.y1 + mark.y2) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.abs(mark.x2 - mark.x1) / 2, Math.abs(mark.y2 - mark.y1) / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else if (mark.tool === 'arrow') {
    drawArrow(ctx, mark.x1, mark.y1, mark.x2, mark.y2);
  } else if (mark.tool === 'text') {
    ctx.font = '700 48px "Noto Sans TC", sans-serif';
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(mark.text, mark.x1, mark.y1);
    ctx.fillText(mark.text, mark.x1, mark.y1);
  }
  ctx.restore();
}

function drawEditorCanvas() {
  const canvas = document.getElementById('photoEditorCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (editorState.image) ctx.drawImage(editorState.image, 0, 0, canvas.width, canvas.height);
  editorState.marks.forEach(mark => drawMark(ctx, mark));
  if (editorState.draft) drawMark(ctx, editorState.draft);
}

function undoEditMark() {
  editorState.marks.pop();
  drawEditorCanvas();
}

function saveEditedPhoto() {
  const item = session.items.find(i => i.id === editorState.itemId);
  if (!item) return;
  drawEditorCanvas();
  const canvas = document.getElementById('photoEditorCanvas');
  item.photos[editorState.photoIdx] = canvas.toDataURL('image/jpeg', 0.9);
  const img = document.querySelector(`#thumb-${editorState.itemId}-${editorState.photoIdx} .photo-thumb`);
  if (img) img.src = item.photos[editorState.photoIdx];
  saveSession();
  closePhotoEditor();
  showToast('✅ 已儲存照片標註');
}

document.getElementById('photoEditorCanvas').addEventListener('pointerdown', ev => {
  if (!editorState.image) return;
  const p = getCanvasPoint(ev);
  if (editorState.tool === 'text') {
    const text = document.getElementById('editorTextInput').value.trim() || prompt('輸入標註文字');
    if (text) {
      editorState.marks.push({ tool: 'text', x1: p.x, y1: p.y, text });
      drawEditorCanvas();
    }
    return;
  }
  editorState.start = p;
  editorState.draft = { tool: editorState.tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  ev.currentTarget.setPointerCapture(ev.pointerId);
});

document.getElementById('photoEditorCanvas').addEventListener('pointermove', ev => {
  if (!editorState.start || !editorState.draft) return;
  const p = getCanvasPoint(ev);
  editorState.draft.x2 = p.x;
  editorState.draft.y2 = p.y;
  drawEditorCanvas();
});

document.getElementById('photoEditorCanvas').addEventListener('pointerup', ev => {
  if (!editorState.start || !editorState.draft) return;
  const mark = editorState.draft;
  if (Math.abs(mark.x2 - mark.x1) > 8 || Math.abs(mark.y2 - mark.y1) > 8) {
    editorState.marks.push(mark);
  }
  editorState.start = null;
  editorState.draft = null;
  drawEditorCanvas();
});

// ══ Done / Undo ══
function doneItem(id) {
  const item = session.items.find(i => i.id === id);
  if (!item) return;
  item.conclusion = document.getElementById(`conc-${id}`)?.value || item.conclusion;
  item.done = true;
  refreshCard(item);
  updateProgress();
  saveSession();
}
function undoneItem(id) {
  const item = session.items.find(i => i.id === id);
  if (!item) return;
  item.done = false;
  refreshCard(item);
  updateProgress();
  saveSession();
}
function refreshCard(item) {
  const old = document.getElementById(`card-${item.id}`);
  if (!old) return;
  const container = document.getElementById('agendaCards');
  const next = old.nextSibling;
  old.remove();
  // Re-append at same position
  const tmp = document.createElement('div');
  container.insertBefore(tmp, next);
  appendCard(item, container);
  tmp.remove();
}

// ══ Delete item ══
function deleteItem(id) {
  const item = session.items.find(i => i.id === id);
  if (!item) return;
  const label = item.topic.length > 20 ? item.topic.slice(0,20)+'…' : item.topic;
  if (!confirm(`確定要刪除事項：\n「${label}」？\n\n此項將不會出現在報表中。`)) return;
  session.items = session.items.filter(i => i.id !== id);
  document.getElementById(`card-${id}`)?.remove();
  updateProgress();
  saveSession();
  showToast('已刪除，可新增臨時事項補充');
}

// ══ Progress ══
function updateProgress() {
  const total = session.items.length;
  const done = session.items.filter(i => i.done).length;

  const newId = session.items.length > 0 ? Math.max(...session.items.map(i=>i.id)) + 1 : 1;

// ══ Print Page (iOS: Share → Print → pinch to PDF) ══
function printPage() {
  showToast('iPhone：列印畫面中，用兩指捏合放大即可存PDF');
  setTimeout(() => window.print(), 400);
}

function makeReportFilename(ext) {
  const unit = (session.unit || '未命名').replace(/[\\/:*?"<>|]/g, '').trim() || '未命名';
  const date = (session.date || fmtDate(new Date())).replace(/\//g, '-');
  return `會勘紀錄_${unit}_${date}.${ext}`;
}

function downloadBlob(blob, filename) {
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, filename);
    return true;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return url;
}

function showDownloadModal(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.getElementById('pdfDownloadLink');
  link.href = url;
  link.download = filename;
  document.getElementById('pdfFrame').src = url;
  document.getElementById('pdfModal').dataset.url = url;
  document.getElementById('pdfModal').classList.add('open');
}

function closePdfModal() {
  const modal = document.getElementById('pdfModal');
  const url = modal.dataset.url;
  modal.classList.remove('open');
  document.getElementById('pdfFrame').src = 'about:blank';
  if (url) URL.revokeObjectURL(url);
  modal.dataset.url = '';
}

// ══ Export PDF ══
async function exportPDF() {
  const btn = document.getElementById('btnPdf');
  btn.textContent = '⏳ 產生中…';
  btn.disabled = true;
  try {
    const { jsPDF } = window.jspdf;
    const el = document.getElementById('printArea');
    const origW = el.style.width;
    el.style.width = '860px';

    const canvas = await html2canvas(el, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: '#ffffff', logging: false
    });
    el.style.width = origW;

    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const margin = 8;
    const cw = pw - margin*2;
    const imgH = cw * canvas.height / canvas.width;
    const pageH = ph - margin*2;
    let srcY = 0, remaining = imgH;

    while (remaining > 0) {
      const sliceH = Math.min(remaining, pageH);
      const sc = document.createElement('canvas');
      sc.width = canvas.width;
      sc.height = Math.round(sliceH * canvas.height / imgH);
      sc.getContext('2d').drawImage(canvas, 0, Math.round(srcY * canvas.height / imgH), canvas.width, sc.height, 0, 0, canvas.width, sc.height);
      pdf.addImage(sc.toDataURL('image/jpeg',0.92), 'JPEG', margin, margin, cw, sliceH);
      remaining -= sliceH; srcY += sliceH;
      if (remaining > 0) pdf.addPage();
    }

    const pdfBlob = pdf.output('blob');
    const fname = makeReportFilename('pdf');
    const result = downloadBlob(pdfBlob, fname);
    if (typeof result === 'string') {
      showDownloadModal(pdfBlob, fname);
      showToast('✅ PDF 已產生，若未自動下載可點上方「下載」');
    } else {
      showToast('✅ PDF 已開始下載');
    }
  } catch(e) {
    console.error(e);
    showToast('❌ 產生失敗，請改用「列印存PDF」');
  }
  btn.textContent = '⬇ 下載 PDF';
  btn.disabled = false;
}

    <w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"/>
  </w:sectPr>
</w:body></w:document>`;

  return docXml;
}

function strToUint8(str) {
  return new TextEncoder().encode(str);
}

function dataUrlToBytes(dataUrl) {
  const parts = dataUrl.split(',');
  const meta = parts[0] || '';
  const mime = (meta.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const binary = atob(parts[1] || '');
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return { bytes, mime };
}

function getImageInfo(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve({ width: img.naturalWidth || img.width, height: img.naturalHeight || img.height });
    img.onerror = () => resolve({ width: 1200, height: 900 });
    img.src = src;
  });
}

async function prepareDocxImages(items) {
  const images = [];
  let n = 1;
  for (let itemIndex = 0; itemIndex < items.length; itemIndex++) {
    const item = items[itemIndex];
    for (let photoIndex = 0; photoIndex < item.photos.length; photoIndex++) {
      const src = item.photos[photoIndex];
      const { bytes, mime } = dataUrlToBytes(src);
      const ext = mime.includes('png') ? 'png' : 'jpg';
      const info = await getImageInfo(src);
      const maxCx = 4320000;
      const maxCy = 3240000;
      const ratio = info.width / Math.max(info.height, 1);
      let cx = maxCx;
      let cy = Math.round(maxCx / ratio);
      if (cy > maxCy) {
        cy = maxCy;
        cx = Math.round(maxCy * ratio);
      }
      images.push({
        itemIndex,
        photoIndex,
        rid: `rIdImg${n}`,
        docPrId: 1000 + n,
        filename: `photo_${itemIndex + 1}_${photoIndex + 1}.${ext}`,
        bytes,
        mime,
        cx,
        cy
      });
      n++;
    }
  }
  return images;
}

let crcTable = null;
function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[n] = c >>> 0;
    }
  }
  let crc = 0 ^ -1;
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ -1) >>> 0;
}

function u16(n) {
  const b = new Uint8Array(2);
  b[0] = n & 255;
  b[1] = (n >>> 8) & 255;
  return b;
}

function u32(n) {
  const b = new Uint8Array(4);
  b[0] = n & 255;
  b[1] = (n >>> 8) & 255;
  b[2] = (n >>> 16) & 255;
  b[3] = (n >>> 24) & 255;
  return b;
}

function concatBytes(parts) {
  const total = parts.reduce((sum, p) => sum + p.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  parts.forEach(p => {
    out.set(p, offset);
    offset += p.length;
  });
  return out;
}

function dosTimeDate(d) {
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  return { time, date };
}

function createZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const now = dosTimeDate(new Date());

  files.forEach(file => {
    const nameBytes = strToUint8(file.name);
    const data = typeof file.data === 'string' ? strToUint8(file.data) : file.data;
    const crc = crc32(data);
    const local = concatBytes([
      u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(now.time), u16(now.date),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0), nameBytes, data
    ]);
    localParts.push(local);

    const central = concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(now.time), u16(now.date),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(offset), nameBytes
    ]);
    centralParts.push(central);
    offset += local.length;
  });

  const centralOffset = offset;
  const central = concatBytes(centralParts);
  const end = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(central.length), u32(centralOffset), u16(0)
  ]);
  return concatBytes([...localParts, central, end]);
}

function buildDocxBlob(docXml, images = []) {
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="jpg" ContentType="image/jpeg"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Default Extension="png" ContentType="image/png"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
  <Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`;
  const imageRels = images.map(img => `
  <Relationship Id="${img.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${img.filename}"/>`).join('');
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${imageRels}
</Relationships>`;
  const created = new Date().toISOString();
  const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
  xmlns:dc="http://purl.org/dc/elements/1.1/"
  xmlns:dcterms="http://purl.org/dc/terms/"
  xmlns:dcmitype="http://purl.org/dc/dcmitype/"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <dc:title>工地巡視會勘紀錄表</dc:title>
  <dc:creator>會勘紀錄工具</dc:creator>
  <cp:lastModifiedBy>會勘紀錄工具</cp:lastModifiedBy>
  <dcterms:created xsi:type="dcterms:W3CDTF">${created}</dcterms:created>
  <dcterms:modified xsi:type="dcterms:W3CDTF">${created}</dcterms:modified>
</cp:coreProperties>`;
  const app = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"
  xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">
  <Application>會勘紀錄工具</Application>
</Properties>`;

  const files = [
    { name: '[Content_Types].xml', data: contentTypes },
    { name: '_rels/.rels', data: rels },
    { name: 'word/_rels/document.xml.rels', data: docRels },
    { name: 'word/document.xml', data: docXml },
    { name: 'docProps/core.xml', data: core },
    { name: 'docProps/app.xml', data: app },
    ...images.map(img => ({ name: `word/media/${img.filename}`, data: img.bytes }))
  ];
  const zip = createZip(files);
  return new Blob([zip], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

async function exportWord() {
  const btn = document.getElementById('btnWord');
  btn.textContent = '⏳ 產生中…';
  btn.disabled = true;
  try {
    // Flush conclusions
    session.items.forEach(item => {
      const el = document.getElementById(`conc-${item.id}`);
      if (el) item.conclusion = el.value;
    });

    const images = await prepareDocxImages(session.items);
    const docXml = buildDocx(session.items, session, images);
    const blob = buildDocxBlob(docXml, images);
    const fname = makeReportFilename('docx');
    downloadBlob(blob, fname);
    showToast('✅ Word 檔已開始下載，可直接交付或編輯');
  } catch(e) {
    console.error(e);
    showToast('❌ 產生失敗：' + e.message);
  }
  btn.textContent = '📝 匯出 Word';
  btn.disabled = false;
}


// ══ Copy text ══
function copyReportText() {
  let t = `【工地巡視會勘紀錄表】\n`;
  t += `巡視單位：${session.unit}\n`;
  t += `主持長官：${session.officer}\n`;
  if (session.escort) t += `陪同人員：${session.escort}\n`;
  if (session.org) t += `主辦單位：${session.org}\n`;
  t += `會勘日期：${session.date}\n`;
  t += `${'─'.repeat(36)}\n\n`;
  session.items.forEach((item,i) => {
    t += `【${i+1}】${item.topic}${item.isExtra?' ★臨時新增':''}\n`;
    t += `結論：${item.conclusion || '（未填寫）'}\n`;
    if (item.photos.length) t += `照片：${item.photos.length} 張\n`;
    t += '\n';
  });
  t += `${'─'.repeat(36)}\n製表：${fmtDateTime(new Date())}`;
  navigator.clipboard.writeText(t).then(() => showToast('✅ 已複製到剪貼板'));
}

// ══ Helpers ══
function fmtDate(d) {
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
}
function fmtDateTime(d) {
  if (!d) return '—';
  return `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function getDuration(a, b) {
  const s = Math.floor((b-a)/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h} 小時 ${m} 分` : `${m} 分 ${s%60} 秒`;
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}


// ══ Resume on load ══
(function() {
  const saved = loadSession();
  if (!saved) return;
  const t = saved.startTime ? new Date(saved.startTime).toLocaleString('zh-TW') : '';
  const doneN = (saved.items||[]).filter(i=>i.done).length;
  if (!confirm(`偵測到上次未完成的會勘紀錄：\n\n📍 ${saved.unit}　👤 ${saved.officer}\n🕐 ${t}\n📋 共 ${(saved.items||[]).length} 項（${doneN} 項已完成）\n\n是否繼續上次的紀錄？\n（選「取消」將清除舊紀錄）`)) {
    clearSession(); return;
  }
  session = saved;
  document.getElementById('iUnit').value = saved.unit || '';
  document.getElementById('iOfficer').value = saved.officer || '';
  document.getElementById('iEscort').value = saved.escort || '';
  document.getElementById('iDate').value = saved.date || '';
  document.getElementById('iOrg').value = saved.org || '';
  renderAgenda();
  updateProgress();
  switchTab('agenda');
  showToast(`✅ 已還原 ${(saved.items||[]).length} 項議題紀錄`);
})();

// Init date
document.getElementById('iDate').value = new Date().toISOString().split('T')[0];
</script>
